<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Historique Humidité</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-light">
    <div class="container mt-5">
        <a href="{% url 'dashboard' %}" class="btn btn-outline-secondary mb-4">← Retour au Dashboard</a>

        <div class="card shadow border-0">
            <div class="card-body p-4">
                <h3 class="text-primary fw-bold mb-4">Historique de l'Humidité</h3>
                <div style="height: 400px;">
                    <canvas id="humChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        fetch('/api/list')
            .then(res => res.json())
            .then(data => {
                const labels = data.map(item => {
                    return new Date(item.dt).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                });
                const hums = data.map(item => item.hum);

                const ctx = document.getElementById('humChart').getContext('2d');
                new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: 'Humidité (%)',
                            data: hums,
                            borderColor: '#0d6efd',
                            backgroundColor: 'rgba(13, 110, 253, 0.2)',
                            fill: true,
                            tension: 0.4,
                            pointRadius: 2
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: { 
                            y: { 
                                beginAtZero: true, 
                                max: 100,
                                title: {
                                    display: true,
                                    text: 'Pourcentage (%)'
                                }
                            }
                        }
                    }
                });
            });
    </script>
</body>
</html>
