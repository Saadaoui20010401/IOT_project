<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Historique Température</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-light">
    <div class="container mt-5">
        <a href="{% url 'dashboard' %}" class="btn btn-outline-secondary mb-4">← Retour au Dashboard</a>

        <div class="card shadow border-0">
            <div class="card-body p-4">
                <h3 class="text-danger fw-bold mb-4">Historique de la Température</h3>
                <div style="height: 400px;">
                    <canvas id="tempChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        fetch('/api/list')
            .then(res => res.json())
            .then(data => {
                // Inverser pour avoir l'historique dans le bon sens (optionnel selon votre API)
                // Si votre API renvoie le plus ancien en premier, enlevez .reverse()
                // Ici on suppose que l'API renvoie tout

                const labels = data.map(item => {
                    return new Date(item.dt).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                });
                const temps = data.map(item => item.temp);

                const ctx = document.getElementById('tempChart').getContext('2d');
                new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: 'Température (°C)',
                            data: temps,
                            borderColor: '#dc3545',
                            backgroundColor: 'rgba(220, 53, 69, 0.2)',
                            fill: true,
                            tension: 0.4,
                            pointRadius: 2
                        }]
                    },
                    options: { 
                        responsive: true, 
                        maintainAspectRatio: false,
                        scales: {
                            y: {
                                beginAtZero: false
                            }
                        }
                    }
                });
            });
    </script>
</body>
</html>
