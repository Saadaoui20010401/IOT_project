{% load static %}
<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connexion</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container">
  <div class="row justify-content-center align-items-center" style="min-height: 100vh;">
    <div class="col-md-5">
      <div class="card shadow-sm border-0">
        <div class="card-body p-4">
          <h3 class="mb-2">Connexion</h3>
          <p class="text-muted mb-4">Accès sécurisé au dashboard</p>

          {% if form.errors %}
            <div class="alert alert-danger">
              Identifiants incorrects. Réessayez.
            </div>
          {% endif %}

          <form method="post" novalidate>
            {% csrf_token %}

            <div class="mb-3">
              <label class="form-label" for="id_username">Nom d’utilisateur</label>
              {{ form.username }}
            </div>

            <div class="mb-3">
              <label class="form-label" for="id_password">Mot de passe</label>
              {{ form.password }}
            </div>

            {% if next %}
              <input type="hidden" name="next" value="{{ next }}">
            {% endif %}

            <button class="btn btn-dark w-100" type="submit">Se connecter</button>
          </form>

          <div class="mt-3 text-center">
            <a href="{% url 'home' %}" class="text-decoration-none">← Retour Accueil</a>
          </div>
        </div>
      </div>
      <p class="text-center text-muted mt-3 small">IoT Monitor • Django</p>
    </div>
  </div>
</div>

<script>
  // Bootstrap styling for Django form inputs
  document.addEventListener("DOMContentLoaded", () => {
    const u = document.getElementById("id_username");
    const p = document.getElementById("id_password");
    if (u) u.classList.add("form-control");
    if (p) p.classList.add("form-control");
  });
</script>

</body>
</html>
